# 계정 기본값 · UTM 정책 · 통화
account:
  currency: KRW           # 광고 계정 통화. insights 값 해석 기준.
  timezone: Asia/Seoul

utm:
  # ⚠ utm_medium 은 paid_social 로 고정한다.
  #   이전에 쓰던 DA 는 GA4 기본 채널 그룹의 유료 판정 정규식
  #   ^(.*cp.*|ppc|retargeting|paid.*)$ 에 걸리지 않아 Unassigned/Other 로 떨어진다.
  #   (네이밍 규칙 v1.0 시트는 utm_medium=Medium 이라고 되어 있으나, 이후 UTM 생성기 시트에서
  #    paid_social 로 정정되었다. 최신 정책인 paid_social 을 기본값으로 둔다.)
  source: meta
  medium: paid_social
  # Meta 광고의 [URL 파라미터] 칸에 아래 한 줄을 넣어두면 이름이 자동으로 채워지고 인코딩까지 된다.
  # roasloop 은 광고 생성 시 이 문자열을 url_tags 로 넣는다. (권장)
  use_dynamic_macros: true

conversion:
  # insights 에서 매출/구매수를 읽어올 action_type 우선순위
  action_types: [omni_purchase, purchase, offsite_conversion.fb_pixel_purchase]
  # 어트리뷰션 윈도우. 계정 기본과 다르면 여기서 고정한다.
  attribution_windows: [7d_click, 1d_view]

defaults:
  country: US
  source: Meta
  medium: DA
  sales_channel: SPF
  language: EN
  product_line: Yulmu
  objective: Conversion
  ad_product: bau
  opt_event: Purchase
  promo: 26Regular
