# 캠페인 소유 구분 — 어느 캠페인이 내 것이고 어느 것이 대행사 것인지.
#
# 이 파일의 목적은 단 하나다: 대행사가 운영하는 캠페인을 실수로 건드리지 않는 것.
#
# 규칙
#   · 기본 동작은 '보고서만'이다. roasloop 은 어떤 명령에서도 저절로 광고를 끄지 않는다.
#   · 광고를 끄거나 만드는 명령(apply / launch)은 아래 mine 에 걸린 캠페인에만 동작한다.
#   · 어디에도 안 걸리면 unknown 으로 분류하고, 절대 건드리지 않는다.
#     "모르면 남의 것" 이 이 파일의 기본 전제다.

# 내 캠페인 — 판정 결과를 실제로 적용할 수 있는 대상
#
# ⚠ 아직 비어 있습니다. 비어 있으면 apply/launch 가 아무 캠페인도 건드리지 않습니다.
#   (판정과 보고서는 정상 동작합니다.)
#
#   채우는 방법: `roasloop campaigns` 를 실행하면 계정의 캠페인 목록과 현재 분류가 나옵니다.
#   그중 내 캠페인을 골라 아래에 추가하세요.
#
#     mine:
#       - name: "정확한 캠페인명 그대로"        # 이름 완전 일치 — 가장 안전
#       - pattern: '^IH_'                     # 정규식 부분 일치 — 이름 규칙이 있을 때
mine: []

# 대행사 캠페인 — 보고서에는 나오지만 절대 건드리지 않는다
#
#   대행사 캠페인은 네이밍 규칙에 따라 E_US 로 시작합니다.
#   (E = 고정 접두, US = 국가. "리터니티 US 광고 네이밍 규칙 v1.0")
agency:
  - pattern: '^E_US'
  # 다른 국가로 확장하면 아래처럼 추가하세요
  # - pattern: '^E_CA'

# 라벨 표시용 (보고서에만 쓰인다)
labels:
  mine: 인하우스
  agency: 대행사
  unknown: 미분류
