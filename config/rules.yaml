# ROAS 컷 규칙
# "얼마나 써봤을 때, 어느 선 밑이면 끈다" 를 정의한다.
# 핵심은 노이즈로 죽이지 않는 것. 구매 수가 적을수록 ROAS 는 심하게 흔들린다.

targets:
  target_roas: 1.8        # 이 밑이라고 판단되면 KILL
  scale_roas:  2.5        # 이 위라고 판단되면 SCALE

  # 목표선을 낮추면 KILL 판정이 줄고 KEEP 이 늘어난다. 애매한 구간을 더 오래
  # 태워본다는 뜻이므로, 확장선(scale_roas)까지 같이 내리지는 않는 편이 낫다.
  # 끄는 기준만 눅이고, 확장 판정은 그대로 엄격하게 둔다.

gates:
  # 아래 셋을 다 넘기기 전에는 판정하지 않는다 (INSUFFICIENT = 계속 돌린다).
  min_spend: 60000        # 계정 통화 기준. 권장값 = 목표 CPA × 1.5 ~ 2
  min_impressions: 3000
  min_days: 3

early_kill:
  # 게이트를 다 못 넘겨도, 이만큼 쓰고 구매가 0이면 끊는다.
  enabled: true
  spend_no_purchase: 120000   # 권장값 = 목표 CPA × 3
  # 참고: 26년 6~7월 자사몰 CPA 98,247 ~ 113,305원

confidence:
  # 구매 수를 포아송으로 보고 ROAS 신뢰구간을 만든다. (객단가는 관측값 고정)
  #   KILL  = ROAS 신뢰구간 상단 < target_roas  → "목표보다 낮은 게 거의 확실"
  #   SCALE = ROAS 신뢰구간 하단 >= scale_roas  → "목표보다 높은 게 거의 확실"
  level: 0.80             # 0.80 = 양측 10%씩. 소재 테스트에는 0.95보다 0.80이 실용적이다.
  # 구매 0건일 때 상단을 계산하려면 객단가 가정이 필요하다.
  fallback_aov: 55000     # 계정 평균 객단가. insights 에서 자동 추정되면 그 값이 우선한다.

guards:
  # 부가 경고. 판정을 바꾸지는 않고 리포트에 사유로 남는다.
  max_frequency: 3.0
  min_ctr: 0.008

measurement:
  # ROAS 로 판정하지 않을 캠페인.
  #
  # 여기 걸린 캠페인은 판정에서 빠지지만, 지출은 "측정 제외" 로 따로 집계되어 보고서에 남는다.
  # 없는 셈 치는 게 아니라, 다른 잣대로 봐야 하는 것들을 갈라내는 것이다.
  exclude:
    - pattern: '_AMZ_'
      reason: '아마존 — 랜딩이 아마존 내부라 자사몰 픽셀이 구매를 볼 수 없다'
    - pattern: '_Traffic_'
      reason: '트래픽 캠페인 — 구매가 목표가 아니다'
    - pattern: '_Reach_'
      reason: '도달 캠페인 — 구매가 목표가 아니다'
    - pattern: '_Videoview_'
      reason: '동영상 조회 캠페인 — 구매가 목표가 아니다'
    - pattern: '_Engagement_'
      reason: '참여 캠페인 — 구매가 목표가 아니다'
    # TikTok Shop 도 자사몰 픽셀 밖에서 전환이 일어난다면 아래 주석을 푸세요.
    # - pattern: '_TTS_'
    #   reason: 'TikTok Shop — 자사몰 픽셀 밖에서 전환이 일어난다'

  # 반대로 '이것만 판정한다' 로 좁히고 싶을 때. 비워 두면 exclude 만 적용된다.
  #   include:
  #     - pattern: '_SPF_'
  include: []

steady:
  # 꾸준히 오래 구매를 일으킨 소재("스테디") 판정 기준.
  #
  # 14일 스냅샷 ROAS 만 보면 오래 버틴 소재와 최근 반짝한 소재가 구분되지 않는다.
  # 날짜별 성과를 받아 "며칠 살아 있었나" 와 "구매가 끊기지 않았나" 를 함께 본다.
  min_active_days: 7        # 조회 기간 중 실제로 돈이 나간 날이 이만큼 이상
  min_purchase_days: 4      # 그중 구매가 발생한 날이 이만큼 이상
  min_purchase_day_rate: 0.4  # 살아 있던 날 대비 구매가 난 날의 비율
  min_age_days: 21          # 광고가 만들어진 지 이만큼 지났으면 '오래된' 것으로 본다
  min_roas: 1.5             # 스테디로 인정할 최소 ROAS. 목표선보다 조금 낮게 둔다.

  # 스테디로 판정된 소재는 중단 제안에서 경고를 단다.
  # 오래 꾸준히 팔아온 소재를 2주치 숫자만 보고 끄면 매출 기반이 사라진다.
  protect_from_kill: true
